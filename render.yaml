services:
  # ── Frontend (Static Site) ──────────────────────────────────
  - type: web
    name: purple-cbd-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: purple-cbd-api
          type: web
          property: host

  # ── Backend (Node.js API) ───────────────────────────────────
  - type: web
    name: purple-cbd-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        fromService:
          name: purple-cbd-frontend
          type: web
          property: host
